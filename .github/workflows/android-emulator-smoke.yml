name: Android emulator smoke and screenshot

on:
  push:
    branches: [feat/hybrid-server-foundation]
    paths:
      - '.github/test-trigger.txt'
      - 'src/**'
      - 'android/**'
      - 'scripts/android-emulator-smoke.sh'
      - 'scripts/verify_android_ed25519_vector.mjs'
      - '.github/workflows/android-emulator-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  # Let long-running Android verification finish even when another development commit lands.
  cancel-in-progress: false

jobs:
  android-emulator:
    name: Install, launch and screenshot Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web and synchronize Android
        run: |
          npm run build
          npx cap sync android
      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet cairosvg Pillow
          python3 scripts/generate_android_icons.py
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash scripts/android-emulator-smoke.sh
            (cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon)
            adb logcat -d -v brief -s ProductionMfEd25519:I '*:S' > artifacts/android-smoke/ed25519-test-vectors.log
            node scripts/verify_android_ed25519_vector.mjs artifacts/android-smoke/ed25519-test-vectors.log
      - name: Verify emulator screenshots are not blank
        run: python3 scripts/check_android_screenshots.py
      - name: Upload screenshot and diagnostics (even if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshot-and-logs
          path: |
            artifacts/android-smoke/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
