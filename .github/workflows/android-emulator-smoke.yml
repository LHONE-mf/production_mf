name: Android emulator smoke and screenshot

on:
  push:
    branches: [feat/hybrid-server-foundation]
    paths:
      - '.github/test-trigger.txt'
      - 'src/**'
      - 'android/**'
      - 'scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-emulator-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Install, launch and screenshot Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web and synchronize Android
        run: |
          npm run build
          npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-emulator-smoke.sh
      - name: Upload screenshot and diagnostics (even if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshot-and-logs
          path: artifacts/android-smoke/
          if-no-files-found: warn
          retention-days: 7
