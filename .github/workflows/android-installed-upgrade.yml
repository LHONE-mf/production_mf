name: Android installed-upgrade offline data proof

# Dedicated, disposable emulator gate. Never targets a physical phone or production.
on:
  push:
    branches: [ci/task-sync-installed-upgrade-20261118]
    paths:
      - '.github/workflows/android-installed-upgrade.yml'
      - 'android/app/src/androidTest/java/ru/liion/production/OfflineUpgradeWebViewTest.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-installed-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Real APK replacement retains offline IndexedDB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_SHA: 4a37b6fa12341f282c69abedb8e11e1443e6c1aa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lock identical Android signing, version and dependency inputs
        run: |
          git diff --exit-code "$BASELINE_SHA" "$GITHUB_SHA" -- package-lock.json android/app/build.gradle
          npm ci --no-audit --no-fund
      - name: Build pre-fix baseline APK on same emulator debug key
        run: |
          git checkout --detach --force "$BASELINE_SHA"
          npm run build
          npx cap sync android
          (cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/production-mf-baseline.apk"
      - name: Build current APK and explicit test instrumentation
        run: |
          git checkout --detach --force "$GITHUB_SHA"
          npm run build
          npx cap sync android
          (cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/production-mf-updated.apk"
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/production-mf-test.apk"
      - name: Replace installed APK with data retained on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p artifacts/android-upgrade
            adb install "$RUNNER_TEMP/production-mf-baseline.apk"
            adb install "$RUNNER_TEMP/production-mf-test.apk"
            adb shell am instrument -w -e class 'ru.liion.production.OfflineUpgradeWebViewTest#preservesOfflineStateAcrossInstalledApkUpgrade' -e upgradePhase prepare ru.liion.production.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-upgrade/before-upgrade.txt
            grep -q 'OK (1 test)' artifacts/android-upgrade/before-upgrade.txt
            adb shell am force-stop ru.liion.production
            adb install -r "$RUNNER_TEMP/production-mf-updated.apk" | tee artifacts/android-upgrade/install-replace.txt
            grep -q Success artifacts/android-upgrade/install-replace.txt
            adb shell am instrument -w -e class 'ru.liion.production.OfflineUpgradeWebViewTest#preservesOfflineStateAcrossInstalledApkUpgrade' -e upgradePhase verify ru.liion.production.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-upgrade/after-upgrade.txt
            grep -q 'OK (1 test)' artifacts/android-upgrade/after-upgrade.txt
            adb shell dumpsys package ru.liion.production > artifacts/android-upgrade/package.txt
            echo 'PASS: installed APK replaced without uninstall or clear; offline conflict, revision and draft survived.'
      - name: Upload diagnostic proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-installed-upgrade-proof
          path: artifacts/android-upgrade/
          if-no-files-found: warn
