name: CI — web and server

on:
  push:
    branches: [main, feat/hybrid-server-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve a complete result for each commit rather than cancelling validation mid-build.
  cancel-in-progress: false

jobs:
  web:
    name: Web / Android frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=default
      - name: Production build
        run: npm run build

  server:
    name: Fastify server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Server currently has no package-lock.json; npm install is used until a lockfile is committed.
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=default
      - name: Build
        run: npm run build
