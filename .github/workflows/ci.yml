name: CI — web and server

on:
  push:
    branches: [main, feat/hybrid-server-foundation, feat/storage-inventory-foundation]
  pull_request:
    branches: [main, feat/hybrid-server-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve a complete result for each commit rather than cancelling validation mid-build.
  cancel-in-progress: false

jobs:
  web:
    name: Web / Android frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=default
      - name: Production build
        run: npm run build

  server:
    name: Fastify server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable CI database: never connect automated integration tests to production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: production_mf_ci
          POSTGRES_PASSWORD: ci_test_password_only
          POSTGRES_DB: production_mf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U production_mf_ci -d production_mf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgres://production_mf_ci:ci_test_password_only@localhost:5432/production_mf_ci
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked server dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Migrate isolated CI PostgreSQL database
        run: |
          node ../../scripts/migrate-disposable-postgres.mjs
      - name: Unit and real-PostgreSQL integration tests
        run: npm test -- --reporter=default
      - name: Build
        run: npm run build
      - name: Install locked frontend dependencies for the actual Storage browser
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Install isolated pinned browser test tooling
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/storage-browser" --no-package-lock --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/storage-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Storage two-profile operator and reviewed-recovery browser
        working-directory: .
        shell: bash
        env:
          STORAGE_ARTIFACT_DIR: /tmp/storage-artifacts
        run: |
          mkdir -p "$STORAGE_ARTIFACT_DIR"
          export STORAGE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/storage-browser/node_modules/playwright/index.mjs"
          node scripts/storage-operator-smoke.mjs 2>&1 | tee "$STORAGE_ARTIFACT_DIR/operator.log"
      - name: Storage actual backup, restore and reconciliation drill
        working-directory: .
        shell: bash
        env:
          STORAGE_ARTIFACT_DIR: /tmp/storage-artifacts
          STORAGE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$STORAGE_ARTIFACT_DIR"
          node scripts/storage-recovery-drill.mjs 2>&1 | tee "$STORAGE_ARTIFACT_DIR/restore.log"
      - name: Upload Storage engineering evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-engineering-${{ github.sha }}
          path: /tmp/storage-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  m1-report:
    name: M1 automated test report
    runs-on: ubuntu-latest
    needs: [web, server]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Publish phone-readable M1 report
        env:
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          {
            echo '## Production MF — M1 automated checks'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Frontend typecheck, offline sync tests, build | $WEB_RESULT |"
            echo "| Server, PostgreSQL, two-profile Storage browser, backup/restore | $SERVER_RESULT |"
            echo
            echo 'Download storage-engineering artifacts from this run for screenshots, JSON results and logs.'
            echo 'The PostgreSQL service is disposable and separate from production.'
            echo 'Android emulator and real two-device acceptance are **not** covered by this workflow.'
            echo 'Automatic client synchronization remains disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$WEB_RESULT" != success ] || [ "$SERVER_RESULT" != success ]; then
            echo 'M1 automated checks failed; inspect the failed job above.'
            exit 1
          fi
