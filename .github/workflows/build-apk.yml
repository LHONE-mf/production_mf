name: Build Android APK (Capacitor)

# Собираем APK через GitHub Actions при пуше в main и при релизных тегах.
on:
  push:
    branches: [main, feat/hybrid-server-foundation]
    tags: ['v*']
    # Server-only changes do not require rebuilding the Android APK.
    # Tag builds remain available for releases; manual builds remain available on demand.
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'plugins/**'
      - 'scripts/generate_android_icons.py'
      - 'scripts/configure_signing.py'
      - 'scripts/dev-signing/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.*'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {} # ручной запуск с вкладки Actions

permissions:
  contents: read # APK is published as an artifact; the workflow never pushes code

# Одна сборка APK за раз: новый пуш отменяет предыдущий (защита от гонки
# двух workflow, толкающих CI-коммит в refs/heads/main одновременно).
concurrency:
  group: build-apk-${{ github.ref }}
  # Let long-running Android verification finish even when another development commit lands.
  cancel-in-progress: false

jobs:
  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка веб-версии (PWA)
        run: npm run build

      - name: Настройка Java (для Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Добавление Android-платформы Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Подготовка ключа подписи
        id: keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Using secure release signing secrets"
            echo "mode=private-secret" >> "$GITHUB_OUTPUT"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "storepass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "alias=$KS_ALIAS" >> "$GITHUB_OUTPUT"
            echo "keypass=$KEY_PASS" >> "$GITHUB_OUTPUT"
          elif [ -z "$KS_B64$KS_PASS$KS_ALIAS$KEY_PASS" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release tags require a private release signing key in GitHub Actions secrets."
              exit 1
            fi
            echo "::warning::Development APK signed with the public DEVELOPMENT key. Never distribute as production."
            echo "mode=public-development" >> "$GITHUB_OUTPUT"
            base64 -d scripts/dev-signing/keystore.b64 > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "storepass=productionmfdev" >> "$GITHUB_OUTPUT"
            echo "alias=production-mf-dev" >> "$GITHUB_OUTPUT"
            echo "keypass=productionmfdev" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing secrets are partially configured. Supply all four or none."
            exit 1
          fi

      - name: Настройка подписи приложения в Gradle
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.storepass }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.keypass }}
        run: |
          {
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties
          python3 ../scripts/configure_signing.py

      # Share the downloaded Gradle wrapper distribution with Android emulator CI.
      # Prevents repeated upstream GitHub release CDN 504s on fresh runners.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-linux-8.11.1-bin-v1

      - name: Generate Production MF launcher icons
        run: |
          python3 -m pip install --quiet cairosvg Pillow
          python3 scripts/generate_android_icons.py

      - name: Сборка подписанного APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # Gradle distribution downloads occasionally return transient HTTP 504.
          # Keep failures fatal after three bounded attempts.
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle build failed after three attempts"
              exit 1
            fi
            echo "::warning::Gradle build failed (attempt $attempt/3); retrying"
            sleep 15
          done

      # Evidence travels WITH the APK, not only in transient workflow logs.
      # The certificate fingerprint identifies whether an Android in-place update
      # is possible; the commit and APK checksum identify the actual candidate.
      - name: Verify APK signature and record release provenance
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.keystore.outputs.mode }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          report="android/app/build/outputs/apk/release/release-provenance.txt"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          signer="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$signer" && test -x "$signer"
          {
            echo "Production MF APK build provenance"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "github_ref=$GITHUB_REF"
            echo "signing_mode=$SIGNING_MODE"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum "$apk"
            echo "--- APK signature verification ---"
            "$signer" verify --verbose --print-certs "$apk"
          } | tee "$report"
          test -s "$report"
          if [ "$SIGNING_MODE" = "public-development" ]; then
            echo "::warning::This APK uses the public development signing key and is for isolated testing only."
          fi

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/release-provenance.txt
          if-no-files-found: error

