name: Build Android APK (Capacitor)

# Собираем APK через GitHub Actions при пуше в main и при релизных тегах.
on:
  push:
    branches: [main, feat/hybrid-server-foundation]
    tags: ['v*']
  workflow_dispatch: {} # ручной запуск с вкладки Actions

permissions:
  contents: read # APK is published as an artifact; the workflow never pushes code

# Одна сборка APK за раз: новый пуш отменяет предыдущий (защита от гонки
# двух workflow, толкающих CI-коммит в refs/heads/main одновременно).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка веб-версии (PWA)
        run: npm run build

      - name: Настройка Java (для Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Добавление Android-платформы Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Подготовка ключа подписи
        id: keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Permanent signing secrets are required. Refusing to publish an APK signed with a disposable key: Android cannot update an existing installation when the signing certificate changes."
            echo "Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          echo "storepass=$KS_PASS" >> "$GITHUB_OUTPUT"
          echo "alias=$KS_ALIAS" >> "$GITHUB_OUTPUT"
          echo "keypass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Настройка подписи приложения в Gradle
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.storepass }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.keypass }}
        run: |
          {
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties
          python3 ../scripts/configure_signing.py

      - name: Сборка подписанного APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

